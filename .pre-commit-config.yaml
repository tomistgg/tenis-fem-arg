minimum_pre_commit_version: "4.6.1"
default_language_version:
  python: python3.11
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff correctness checks
        entry: python -m ruff check --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy core type checks
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]

