[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tenis-fem-arg"
version = "0.1.0"
description = "Data ingestion and static-site generation for Argentine women's tennis."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4==4.14.3",
    "jsonschema==4.26.0",
    "pandas==2.3.3",
    "pandera[pandas]==0.32.1",
    "pdfplumber==0.11.9",
    "Pillow==12.3.0",
    "pydantic==2.13.4",
    "PyMuPDF==1.27.1",
    "requests==2.33.0",
    "selenium==4.39.0",
    "tzdata==2026.3",
    "undetected-chromedriver==3.5.5",
    "webdriver-manager==4.0.2",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "pandas-stubs==2.3.3.260113",
    "pip-audit==2.10.1",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "ruff==0.15.22",
    "setuptools==83.0.0",
    "types-requests==2.33.0.20260712",
    "types-jsonschema==4.26.0.20260518",
    "uv==0.11.31",
    "wheel==0.47.0",
]

[project.scripts]
wtarg-build-site = "build_deploy_site:main"
wtarg-update = "pipeline_transaction:cli_refresh"
wtarg-validate-data = "canonical_data:main"
wtarg-quality-gate = "data_quality:main"

[tool.setuptools]
py-modules = [
    "build_deploy_site",
    "calendar_builder",
    "canonical_data",
    "config",
    "data_quality",
    "draws",
    "execution_analysis",
    "generate_run_report",
    "html_generator",
    "itf",
    "itf_drawsheet_cache",
    "main",
    "migrate_canonical_data",
    "http_client",
    "pipeline_errors",
    "pipeline_transaction",
    "python_bootstrap",
    "run_state",
    "runtime_logging",
    "runtime_paths",
    "time_utils",
    "transactional_io",
    "tstrength",
    "utils",
    "wta",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "browser: headless Chrome browser smoke tests",
    "integration: offline end-to-end generation tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".site", ".run_snapshot"]

[tool.ruff.lint]
# Start with correctness rules that are safe for the legacy codebase. The
# selection can be expanded incrementally without a repository-wide rewrite.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = [
    "canonical_data.py",
    "data_quality.py",
    "http_client.py",
    "migrate_canonical_data.py",
    "pipeline_errors.py",
    "pipeline_transaction.py",
    "python_bootstrap.py",
    "run_state.py",
    "runtime_paths.py",
    "time_utils.py",
    "transactional_io.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
pretty = true
show_error_codes = true
